# /opt/law_helper/nginx/nginx.conf
# 域名占位符：拿到域名后，将下面两处 your-domain.com 替换为真实域名
# 证书路径固定为 /etc/nginx/certs/（由 deploy.sh 维护：正式证书软链接或自签名占位）

# ===== IP 级限流 zone =====
# 与后端浏览器会话限流（10 次/60 秒）形成双层防护，防止清 cookie 绕过
# $binary_remote_addr 比 $remote_addr 省内存；5m 约可记录 6.4 万个 IP
limit_req_zone $binary_remote_addr zone=api_limit:5m rate=10r/s;
limit_req_zone $binary_remote_addr zone=chat_limit:2m rate=2r/s;

# ===== 80 端口：仅用于 ACME 证书挑战 + 跳转 HTTPS =====
server {
    listen 80 default_server;
    server_name your-domain.com;

    # Let's Encrypt webroot 挑战目录（宿主机 /var/www/certbot 只读挂载）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余请求 301 到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== 443 端口：主站点（HTTPS）=====
server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;

    # TLS 证书（deploy.sh 维护：正式证书软链接或自签名占位）
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Mozilla Intermediate 兼容配置：TLS 1.2 / 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;   # 5m 适配 2G 内存
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ===== 安全响应头 =====
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 前端 index.html 含内联脚本（主题防闪烁）与动态内联样式，故放行 unsafe-inline
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ===== 全站 Basic Auth（子 location 可用 auth_basic off 覆盖）=====
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/htpasswd;

    # 前端静态文件根目录
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 健康检查接口放行（供外部探活/负载均衡），不要求 Basic Auth
    location = /api/v1/health {
        auth_basic off;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源缓存（带 hash 的文件名长期缓存）
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反代到后端容器（含 IP 级限流）
    location /api/ {
        # 全局 API 限流：默认 10r/s，突发 20
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend:8000;   # 结尾不带 /api/，保留原始路径
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / NDJSON 流式响应：禁用缓冲，超时拉长
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 聊天接口更严格限流（2r/s，突发 5），防止 LLM 额度被单 IP 高速刷取
    location ^~ /api/v1/chat {
        limit_req zone=chat_limit burst=5 nodelay;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / NDJSON 流式响应
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # SPA fallback：所有未匹配路由返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
