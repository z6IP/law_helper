# /opt/law_helper/nginx/nginx.conf
server {
    listen 80;
    server_name _;   # 暂用 IP 访问；拿到域名后改为 your-domain.com

    # 前端静态文件根目录
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 静态资源缓存（带 hash 的文件名长期缓存）
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反代到后端容器
    location /api/ {
        proxy_pass http://backend:8000;   # 结尾不带 /api/，保留原始路径
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / NDJSON 流式响应：禁用缓冲，超时拉长
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # SPA fallback：所有未匹配路由返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
