name: Build and push backend image

# 后端镜像只在 CI 构建，服务器不再承担构建负载。
# 背景：2G 内存的生产 ECS 上构建 2GB 级镜像会与运行中的容器争抢内存导致整机卡死，
# 因此构建整体迁移到 GitHub Actions，产物推送到阿里云 ACR，服务器只做 docker pull。

on:
  push:
    branches: [main]
    paths:
      # 只有会影响镜像内容或构建方式的改动才触发，避免纯文档改动也跑一次重型构建
      - 'app/**'
      - 'config/**'
      - 'prompts/**'
      - 'statute/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build-backend-image.yml'
  workflow_dispatch:

# 同一分支只保留最新一次构建：避免并发推送互相覆盖 latest 标签与层缓存
concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/law-helper-backend

jobs:
  build:
    runs-on: ubuntu-latest
    # 首次构建需跨境推送全量镜像（约 1.5-2.5GB），给足时间避免被默认超时中断
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 与生产 ECS 架构保持一致（GitHub 托管 runner 本身也是 amd64，显式声明以防变更）
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # 层缓存存回 ACR：requirements.txt 未变时依赖层直接命中，
          # 后续构建只需推送变化的层（通常几 MB 到几十 MB），
          # 规避每次跨境重传约 2GB。mode=max 会把中间层也纳入缓存，这是增量推送的前提。
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: 输出构建结果
        run: |
          echo "已推送镜像："
          echo "  ${{ env.IMAGE_NAME }}:latest"
          echo "  ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "镜像摘要：${{ steps.build.outputs.digest }}"
          echo ""
          echo "服务器部署（deploy.env 已配置的前提下）："
          echo "  bash deploy.sh                              # 部署 latest"
          echo "  IMAGE_TAG=${{ github.sha }} bash deploy.sh   # 部署/回滚到本次构建"
