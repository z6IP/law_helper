name: Build and push backend image

# 后端镜像只在 CI 构建，服务器不再承担构建负载。
# 背景：2G 内存的生产 ECS 上构建 2GB 级镜像会与运行中的容器争抢内存导致整机卡死，
# 因此构建整体迁移到 GitHub Actions，产物推送到阿里云 ACR，服务器只做 docker pull。

on:
  push:
    branches: [main]
    paths:
      # 只有会影响镜像内容或构建方式的改动才触发，避免纯文档改动也跑一次重型构建
      - 'app/**'
      - 'config/**'
      - 'prompts/**'
      - 'statute/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build-backend-image.yml'
  workflow_dispatch:

# 同一分支只保留最新一次构建：避免并发推送互相覆盖 latest 标签与层缓存
concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/law-helper-backend

jobs:
  build:
    runs-on: ubuntu-latest
    # 首次构建需跨境推送全量镜像（约 1.5-2.5GB），给足时间避免被默认超时中断
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 校验仓库配置
        env:
          CFG_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          CFG_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          CFG_USERNAME: ${{ secrets.ACR_USERNAME }}
          CFG_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          # 逐个点名缺失项。否则 docker/login-action 只会抛出
          # "Username and password required"，无法判断缺的是哪个，
          # 也看不出是不是建到了 Variables / Environments 下导致 secrets.* 读不到。
          missing=""
          for pair in ACR_REGISTRY:CFG_REGISTRY ACR_NAMESPACE:CFG_NAMESPACE ACR_USERNAME:CFG_USERNAME ACR_PASSWORD:CFG_PASSWORD; do
            name="${pair%%:*}"
            var="${pair##*:}"
            if [ -z "${!var}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::缺少仓库配置:${missing}"
            echo ""
            echo "请到 GitHub 仓库 → Settings → Secrets and variables → Actions"
            echo "→【Secrets】标签页 →【Repository secrets】补齐上述名称（大小写与下划线逐字一致）。"
            echo "常见错误：建到了 Variables 标签页或 Environments 下，此时 secrets.* 取不到值。"
            exit 1
          fi
          echo "4 项仓库配置均已就位"

      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 与生产 ECS 架构保持一致（GitHub 托管 runner 本身也是 amd64，显式声明以防变更）
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # 层缓存存回 ACR：requirements.txt 未变时依赖层直接命中，
          # 后续构建只需推送变化的层（通常几 MB 到几十 MB），
          # 规避每次跨境重传约 2GB。mode=max 会把中间层也纳入缓存，这是增量推送的前提。
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          # 关闭 provenance / SBOM 证明。开启时 BuildKit 推送的不是普通镜像，
          # 而是带 application/vnd.oci.empty.v1+json 空描述符的 attestation 索引，
          # 阿里云 ACR 不支持该 manifest 类别，会直接拒绝：
          #   denied: unknown manifest class for application/vnd.oci.empty.v1+json
          # 关闭后推送普通单架构镜像清单，ACR 可正常接收。
          provenance: false
          sbom: false

      - name: 输出构建结果
        run: |
          echo "已推送镜像："
          echo "  ${{ env.IMAGE_NAME }}:latest"
          echo "  ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "镜像摘要：${{ steps.build.outputs.digest }}"
          echo ""
          echo "服务器部署（deploy.env 已配置的前提下）："
          echo "  bash deploy.sh                              # 部署 latest"
          echo "  IMAGE_TAG=${{ github.sha }} bash deploy.sh   # 部署/回滚到本次构建"
