name: Build and push backend image

# 后端镜像默认在本地构建后手动 docker push 到阿里云 ACR（国内网络，通常 1~3 分钟），
# 服务器只做 docker pull；本工作流保留为手动兜底（workflow_dispatch），
# 不再由 push 自动触发——避免 CI 推的 :latest 覆盖本地推送的镜像。
# 背景：2G 内存的生产 ECS 上构建镜像会与运行中的后端容器争抢内存导致整机卡死，
# 因此构建一律不在服务器上进行（本地构建推送，或手动触发本工作流）。

on:
  # 构建默认在本地完成并手动 docker push 到 ACR；CI 仅保留手动触发作为兜底，
  # 避免 push 触发的 CI 构建推 :latest 覆盖本地推送的镜像。
  workflow_dispatch:

# 同一分支只保留最新一次构建：避免并发推送互相覆盖 latest 标签与层缓存
concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/law-helper-backend
  # 纯文本进度输出：exporting 阶段会逐层打印上传进度与体积，
  # 便于区分「正在跨境传输」与「真的卡死」（默认进度模式下该阶段无任何输出）。
  BUILDKIT_PROGRESS: plain

# 本工作流只需读代码 + 向 ACR 推送，显式收窄 GITHUB_TOKEN 权限，
# 避免默认的宽权限被第三方 action 利用（构建供应链最小权限原则）。
# 另建议：将下方各 uses 固定到具体 commit SHA（tag 可被上游重新指向）。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 首次构建需跨境推送全量镜像（约 1.5-2.5GB），给足时间避免被默认超时中断
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 校验仓库配置
        env:
          CFG_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          CFG_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          CFG_USERNAME: ${{ secrets.ACR_USERNAME }}
          CFG_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          # 逐个点名缺失项。否则 docker/login-action 只会抛出
          # "Username and password required"，无法判断缺的是哪个，
          # 也看不出是不是建到了 Variables / Environments 下导致 secrets.* 读不到。
          missing=""
          for pair in ACR_REGISTRY:CFG_REGISTRY ACR_NAMESPACE:CFG_NAMESPACE ACR_USERNAME:CFG_USERNAME ACR_PASSWORD:CFG_PASSWORD; do
            name="${pair%%:*}"
            var="${pair##*:}"
            if [ -z "${!var}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::缺少仓库配置:${missing}"
            echo ""
            echo "请到 GitHub 仓库 → Settings → Secrets and variables → Actions"
            echo "→【Secrets】标签页 →【Repository secrets】补齐上述名称（大小写与下划线逐字一致）。"
            echo "常见错误：建到了 Variables 标签页或 Environments 下，此时 secrets.* 取不到值。"
            exit 1
          fi
          echo "4 项仓库配置均已就位"

      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 与生产 ECS 架构保持一致（GitHub 托管 runner 本身也是 amd64，显式声明以防变更）
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # 层缓存改用 GitHub Actions 缓存后端，不再存回 ACR。
          # 原因：BuildKit 的 registry 缓存清单，其 config 描述符媒体类型固定为
          # application/vnd.buildkit.cacheconfig.v0 —— 它不是镜像配置类型，
          # 阿里云 ACR 个人版按 media type 给清单分类时判定为未知类别并拒收：
          #   denied: unknown manifest class for application/vnd.buildkit.cacheconfig.v0
          # 该限制与上方的 oci.empty.v1+json 同源：ACR 个人版只收标准镜像清单，
          # 不收 OCI artifact 类清单；且缓存导出器的参数（oci-mediatypes /
          # image-manifest）只改清单自身类型，改不了 config 描述符类型，调参无法绕过。
          # 改用 gha 后缓存落在 GitHub，既绕开该限制，也不再跨境传输缓存。
          # mode=max 会把中间层也纳入缓存：本项目是多阶段构建，只有 max 才能让
          # 最终镜像的 COPY --from=builder 命中缓存、跳过重复的 pip install。
          # ignore-error：缓存导出失败（超出 GitHub 缓存配额 / 导出超时）时只丢缓存，
          # 不阻断镜像推送——缓存是加速手段，不该让整个部署失败。
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          # 关闭 provenance / SBOM 证明。开启时 BuildKit 推送的不是普通镜像，
          # 而是带 application/vnd.oci.empty.v1+json 空描述符的 attestation 索引，
          # 阿里云 ACR 不支持该 manifest 类别，会直接拒绝：
          #   denied: unknown manifest class for application/vnd.oci.empty.v1+json
          # 关闭后推送普通单架构镜像清单，ACR 可正常接收。
          provenance: false
          sbom: false

      - name: 输出构建结果
        run: |
          echo "已推送镜像："
          echo "  ${{ env.IMAGE_NAME }}:latest"
          echo "  ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "镜像摘要：${{ steps.build.outputs.digest }}"
          echo ""
          echo "服务器部署（deploy.env 已配置的前提下）："
          echo "  bash deploy.sh                              # 部署 latest"
          echo "  IMAGE_TAG=${{ github.sha }} bash deploy.sh   # 部署/回滚到本次构建"
